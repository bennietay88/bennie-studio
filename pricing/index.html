        <h1 style="font-size:clamp(2rem,4vw,3.6rem);line-height:1.08;letter-spacing:-.04em">A professionally managed business website, with a clear path from launch to ongoing support.</h1>
        <p>Bennie Studio plans, designs, builds, hosts, and maintains websites for service businesses. Compare three levels of managed support before deciding whether your business needs a credible online presence, a stronger source of enquiries, or consultant-led growth work. Pricing is market-specific: choose Malaysia, Singapore, the United Kingdom, or international billing on the interactive page to see current setup and recurring prices. This page requires JavaScript for interactive pricing and checkout, but the commercial principles are explained below.</p>

        <section>
          <h2>Which managed website plan should you consider?</h2>
          <h3>Managed Website — a professional foundation</h3>
          <p>Designed for a service business that needs a clear, mobile-friendly website and a simple way for customers to call, WhatsApp, book a consultation, or submit a quotation request. The service combines website planning and design with hosting, essential search visibility foundations, launch checks and the routine management included in the selected package. Pages, revision allowances, and expected response times are specified by the current plan, rather than promised without a limit.</p>
          <h3>Website Growth — stronger customer acquisition foundations</h3>
          <p>A fit for businesses that already intend to promote their services and want the website to explain their value, show relevant evidence, answer customer questions and capture more useful enquiries. Alongside the managed website foundations, this tier provides expanded conversion planning, local SEO foundations and plan-based improvement work. It does not guarantee any particular search ranking, enquiry volume, conversion rate or revenue.</p>
          <h3>Growth Partner — deeper strategy and growth work</h3>
          <p>A higher-touch managed service where a business needs more substantial direction for conversion, landing pages, local search presence and ongoing optimisation. The exact deliverables depend on the accepted plan and scope. Complex integrations, custom applications, ecommerce and unusual requirements are not automatically included and may require a separate quote.</p>
        </section>
        <section>
          <h2>Understand the full cost before you order</h2>
          <p>The first payment ordinarily contains a one-time setup fee plus the first recurring service charge, before applicable taxes. Setup covers the agreed planning, page structure, design, website build, tracking preparation and launch configuration. Recurring fees cover the hosting, SSL, routine maintenance, agreed update allowance and any ongoing improvements included in that plan. Your initial commitment can span more than one month. A first-payment total is therefore not the same as the overall minimum commitment cost; the interactive order review shows both.</p>
          <p>Select your billing market and compare the amounts in its displayed currency. Different regions have their own published rates; a local amount is not simply a converted estimate of a USD price. Always check the final Stripe order summary before paying. Third-party subscriptions, premium media, advertising, domains, special integrations and additional work can be separate charges where not explicitly included.</p>
        </section>
        <section>
          <h2>What happens between purchase and launch?</h2>
          <p>The work starts with your business details, services, brand information and desired customer action. Bennie Studio shapes the page structure and prepares a design direction, builds the approved scope, checks responsive layout and enquiry paths, and sends the site for customer review before publication. You remain responsible for verifying business claims, regulated wording, legal notices, product information, photographs and testimonials. Timelines depend on receiving a complete brief and the necessary assets; unusually complex requests require additional scoping. The agreed plan sets limits for pages, revisions, updates and turnaround targets.</p>
        </section>
        <section>
          <h2>Ownership, support and cancellation</h2>
          <p>Your existing domain and the original business information, logos and imagery you supply remain yours, subject to third-party rights. Bennie Studio retains its platform code, reusable design systems and proprietary tools. An account handover package can provide portable static website pages and supported business and customer records. Independently hosted exports may require you to reconnect dynamic forms, analytics, booking or other integrations. A full standalone copy of Bennie Studio's underlying application is not part of an ordinary managed subscription.</p>
          <p>Review the minimum initial term, renewal arrangements, cancellation rules, fees and any requested migration support in the written terms before accepting a plan. Hosting and managed features depend on an active subscription. If you intend to move your website, arrange export while the service is active. If you are unsure which package will meet your needs, book a website review before purchasing rather than assuming every feature is included.</p>
        </section>
        <section>
          <h2>Frequently asked questions</h2>
          <h3>Can I see a website direction without purchasing?</h3>
          <p>Yes. The free website direction is a preliminary concept, not a finished live website. No credit card is required for it. An email address is required to connect the generated direction to your enquiry and follow-up.</p>
          <h3>Does the monthly fee guarantee sales or Google rankings?</h3>
          <p>No. Good design, enquiry paths and SEO foundations can support your marketing, but real outcomes depend on demand, competition, reputation, traffic and the quality of your offer.</p>
          <h3>Can I ask someone to review my requirements before payment?</h3>
          <p>Yes. Use <a href="/book-demo">the website review consultation</a> to confirm scope, timings, necessary content, delivery expectations and available options. You can also review <a href="/case-studies">clearly labelled illustrative work</a> and the independent <a href="https://portfolio.bennietay.com/">multi-platform portfolio library</a>.</p>
        </section>
