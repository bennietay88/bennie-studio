        <p style="color:#5746e8;font-weight:800;letter-spacing:.12em;text-transform:uppercase">Free website direction preview</p>
        <h1 style="font-size:clamp(2rem,4vw,3.5rem);line-height:1.08;letter-spacing:-.04em">Explore a website direction for your business before you commit to a managed plan.</h1>
        <p>The Bennie Studio website direction is a preliminary, interactive concept designed to help you see how a professional service-business website might present your offer and encourage the right customers to make contact. It is not the finished paid website, a promise of search rankings, or a live website that will be published automatically. You can inspect a <a href="/portfolio/sample/dental">dental clinic website</a> first, without entering personal details.</p>
        <img src="/og-preview.svg" alt="Bennie Studio free website design direction preview and planning concept" width="960" height="480" style="display:block;max-width:100%;height:auto;margin:32px 0;border:1px solid #e2e8f0" loading="lazy" />
        <section>
          <h2>Who is this useful for?</h2>
          <p>This website preview helps owners of local service companies, consultants, accountants, clinics, tuition centres, contractors, beauty businesses and other professional services make early decisions about website design. Whether you have an outdated website or have never had one, the goal is to clarify how the business should be introduced, what evidence should be shown and where a potential customer should go next. A suitable customer action could be a telephone call, a WhatsApp message, a consultation booking or a request for a quotation.</p>
        </section>
        <section>
          <h2>Step 1 — Tell us what you already have</h2>
          <p>If you have an existing website, the interactive process asks for its public URL and your type of business. The existing site can serve as reference material for the business identity, services and contact information. If you do not have a website, you can instead supply a business name, principal service and the city or areas served. These inputs help determine an appropriate website structure rather than forcing every business into the same generic layout. Providing a working URL, when available, can help us avoid losing useful material during a proposed redesign.</p>
        </section>
        <section>
          <h2>Step 2 — Choose a customer goal and visual direction</h2>
          <p>The preview builder asks about the next action the business most wants customers to take. This matters because websites for booking consultations, generating quotations and showcasing a specialist service should not prioritise the same content. You can also select an appropriate visual personality and provide branding context or real customer feedback if available. Those choices influence the arrangement of content, the direction of headlines, the suggested proof sections and the placement of calls to action. Actual customer reviews and claims must be genuine and checked before a finished site goes live.</p>
        </section>
        <section>
          <h2>Step 3 — Connect the preview to your enquiry</h2>
          <p>For the public preview, Bennie Studio requests an email address so your website direction can be associated with your request and our team can follow up about it. A name may be optional, while a working phone number may be needed if your chosen enquiry journey specifically relies on WhatsApp. We explain the use of contact information before submission and provide a <a href="/privacy">privacy policy</a>. Do not supply passwords, private customer databases or sensitive confidential documents to generate an initial concept. No payment card is required for the free direction.</p>
        </section>
        <section>
          <h2>Step 4 — Review the initial direction, then decide</h2>
          <p>After the guided brief, the interactive experience prepares a website structure, page and message direction that you can review. The free direction is intentionally limited: detailed content writing, final revisions, third-party integration setup, publishing and ongoing hosting are elements of the paid managed service according to the selected scope. Some example content, visual sections or image treatments in an early concept may be illustrative rather than verified business information. Bennie Studio reviews paid builds before launch, and the customer approves the final website and its business claims before publication.</p>
        </section>
        <section>
          <h2>What happens if you like the preview?</h2>
          <p>Choose between Managed Website, Website Growth and Growth Partner according to your intended page count, level of lead-generation support and ongoing management needs. The <a href="/pricing">managed website pricing page</a> explains one-time setup charges, recurring service charges and the initial commitment for your selected country and currency. Before entering a payment card, the order should show what is due immediately, the length of your initial commitment and the plan's stated delivery scope. You can also <a href="/book-demo">book a website review</a> if you prefer to confirm your requirements with a person before purchasing.</p>
        </section>
        <section>
          <h2>Questions before you begin</h2>
          <h3>Does the preview go live immediately?</h3>
          <p>No. A preview is a draft direction; it does not replace your existing website or publish a new website without approval.</p>
          <h3>Do I own my domain and materials?</h3>
          <p>Business content and a domain you already own remain yours, subject to the written terms. The paid managed platform and export arrangements are explained under <a href="/terms">Terms of Service</a>.</p>
          <h3>Can I review the case studies before sharing my email?</h3>
          <p>Yes. You can view a <a href="/portfolio/sample/dental">clearly labelled sample</a>, explore the <a href="/case-studies">design concepts on the app</a>, or visit the independent <a href="https://portfolio.bennietay.com/">Bennie portfolio library</a>. </p>
        </section>
        <p><strong>Start here:</strong> JavaScript is required for the interactive preview builder. If you cannot use the builder, <a href="/contact">contact Bennie Studio</a> or <a href="/book-demo">book a consultation</a> instead.</p>
