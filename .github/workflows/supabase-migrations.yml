name: Supabase Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"

jobs:
  push-migrations:
    name: Push database migrations
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase secrets
        shell: bash
        run: |
          missing=()
          test -n "$SUPABASE_ACCESS_TOKEN" || missing+=("SUPABASE_ACCESS_TOKEN")
          test -n "$SUPABASE_PROJECT_REF" || missing+=("SUPABASE_PROJECT_REF")
          test -n "$SUPABASE_DB_PASSWORD" || missing+=("SUPABASE_DB_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Cannot deploy database migrations. Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
