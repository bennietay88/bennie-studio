name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-candidate/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          code_changed=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          else
            base="${HEAD_SHA}^"
          fi

          changed_files="$(git diff --name-only "$base" "$HEAD_SHA")"
          if [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Ev '(^|/)[^/]+\.md$' >/dev/null; then
            code_changed=false
          fi
          printf 'code_changed=%s\n' "$code_changed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.code_changed == 'true'
      - run: npm run lint
        if: steps.scope.outputs.code_changed == 'true'
      - run: npm run build
        if: steps.scope.outputs.code_changed == 'true'
      - name: Run complete unit and domain regression suite
        if: steps.scope.outputs.code_changed == 'true'
        run: node --import tsx --test tests/*.test.ts
      - run: npm audit --audit-level=high
        if: steps.scope.outputs.code_changed == 'true'

  browser-e2e:
    if: needs.verify.outputs.code_changed == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium end-to-end tests
        run: npm run e2e -- --project=chromium-desktop --project=mobile-chromium

  production-access-smoke:
    # Read-only production access check after full CI, with no credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.code_changed == 'true'
    needs: [verify, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live public health and anonymous API access boundaries
        run: node scripts/production-readonly-smoke.mjs
