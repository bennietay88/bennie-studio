name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 02:00 Malaysia time; full regression
  push:
    branches:
      - main
      - 'release-candidate/**'
      - 'design/**'
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      browser_scope: ${{ steps.scope.outputs.browser_scope }}
      shards: ${{ steps.scope.outputs.shards }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths conservatively
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths=/tmp/bennie-ci-paths.txt
          printf '%s\n' '__full_regression__' > "$paths"
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]]; then
            if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              if ! git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$paths"; then
                printf '%s\n' '__full_regression__' > "$paths"
              fi
            fi
          fi
          node scripts/ci-scope.mjs < "$paths" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          node --version
          npm --version
          npm ci 2>&1 | tee /tmp/bennie-ci-install.log
      - name: TypeScript typecheck
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/bennie-ci-types.log
      - name: Build client and server
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          env VITE_SUPABASE_URL=https://e2e.supabase.co VITE_SUPABASE_ANON_KEY=e2e-anon-key npm run build 2>&1 | tee /tmp/bennie-ci-build.log
      - name: Run complete unit and domain regression suite
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          node --import tsx --test tests/*.test.ts 2>&1 | tee /tmp/bennie-ci-tests.log
      - name: Validate CI scope selection
        if: steps.scope.outputs.code_changed == 'true'
        run: node --test scripts/ci-scope.test.mjs
      - name: Validate design research intake parser
        if: steps.scope.outputs.code_changed == 'true'
        run: npm run test:design-trends
      - name: Dependency vulnerability audit
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee /tmp/bennie-ci-audit.log
      - name: Preserve non-secret CI diagnostics if verify fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verify-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/bennie-ci-*.log
          retention-days: 3
          if-no-files-found: warn


      - name: Share verified fixture build with browser shards
        if: success() && steps.scope.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  browser-e2e-shard:
    # Compilation, build, unit tests and security checks must pass first.
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.verify.outputs.matrix || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Cache Playwright Chromium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and required OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run assigned desktop and mobile Chromium shard
        shell: bash
        env:
          E2E_PREBUILT: '1'
          BROWSER_SCOPE: ${{ needs.verify.outputs.browser_scope }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.verify.outputs.shards }}
        run: |
          set -euo pipefail
          specs=()
          case "$BROWSER_SCOPE" in
            portfolio|marketing)
              mapfile -t specs < <(node --input-type=module -e 'import {portfolioSpecs,marketingSpecs} from "./scripts/ci-scope.mjs"; console.log((process.env.BROWSER_SCOPE==="portfolio"?portfolioSpecs:marketingSpecs).join("\n"))')
              test "${#specs[@]}" -gt 0
              ;;
            full) ;;
            *) echo "Invalid test scope: $BROWSER_SCOPE"; exit 1 ;;
          esac
          npm run e2e -- "${specs[@]}" --project=chromium-desktop --project=mobile-chromium --shard="$SHARD/$SHARDS"
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  browser-e2e:
    # Stable aggregate check for branch rules and downstream production smoke.
    if: always() && !cancelled()
    needs: [verify, browser-e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful verification and all selected browser shards
        shell: bash
        env:
          VERIFY: ${{ needs.verify.result }}
          CODE_CHANGED: ${{ needs.verify.outputs.code_changed }}
          BROWSER: ${{ needs.browser-e2e-shard.result }}
        run: |
          set -euo pipefail
          test "$VERIFY" = success
          if [[ "$CODE_CHANGED" == false ]]; then
            echo "Documentation-only change; browser tests not required."
          else
            test "$CODE_CHANGED" = true
            test "$BROWSER" = success
          fi

  multi-site-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: multisite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate staged migration and multi-tenant contracts in disposable PostgreSQL
        env:
          PGPASSWORD: isolated_test_only
        run: |
          set -euo pipefail
          for file in supabase/rollout/tests/multi_site_fixture.sql supabase/rollout/multi_site_lifecycle.sql supabase/rollout/multi_site_admin.sql supabase/rollout/tests/multi_site_assertions.sql supabase/rollout/internal_owner_verification.sql supabase/rollout/tests/internal_owner_assertions.sql; do
            psql -h 127.0.0.1 -U postgres -d multisite_test -v ON_ERROR_STOP=1 -f "$file"
          done

  production-access-smoke:
    # Read-only production access check after full CI, with no credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.code_changed == 'true'
    needs: [verify, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify live public health and anonymous API access boundaries
        run: node scripts/production-readonly-smoke.mjs
