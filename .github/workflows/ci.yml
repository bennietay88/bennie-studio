name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release-candidate/**'
      - 'design/**'
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          code_changed=true
          # A PR's synthetic merge SHA may be shallow or inaccessible via a
          # separate fetch. Fail *open to testing*, never fail the entire job.
          # This keeps the required verify check present for every PR.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="src/App.tsx"
          else
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              changed_files="$(git diff --name-only "${HEAD_SHA}^" "$HEAD_SHA" || true)"
            else
              changed_files="src/App.tsx"
            fi
          fi
          if [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Ev '(^|/)[^/]+\.md$' >/dev/null; then
            code_changed=false
          fi
          printf 'code_changed=%s\n' "$code_changed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          node --version
          npm --version
          npm ci 2>&1 | tee /tmp/bennie-ci-install.log
      - name: TypeScript typecheck
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/bennie-ci-types.log
      - name: Build client and server
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/bennie-ci-build.log
      - name: Run complete unit and domain regression suite
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          node --import tsx --test tests/*.test.ts 2>&1 | tee /tmp/bennie-ci-tests.log
      - name: Validate design research intake parser
        if: steps.scope.outputs.code_changed == 'true'
        run: npm run test:design-trends
      - name: Dependency vulnerability audit
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee /tmp/bennie-ci-audit.log
      - name: Preserve non-secret CI diagnostics if verify fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verify-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/bennie-ci-*.log
          retention-days: 3
          if-no-files-found: warn


  browser-e2e:
    # Run browser tests even when verify fails, to identify independent regressions.
    if: ${{ !cancelled() && (needs.verify.outputs.code_changed == 'true' || github.event_name == 'pull_request') }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium end-to-end tests
        run: npm run e2e -- --project=chromium-desktop --project=mobile-chromium

  multi-site-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: multisite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate staged migration and multi-tenant contracts in disposable PostgreSQL
        env:
          PGPASSWORD: isolated_test_only
        run: |
          set -euo pipefail
          for file in supabase/rollout/tests/multi_site_fixture.sql supabase/rollout/multi_site_lifecycle.sql supabase/rollout/tests/multi_site_assertions.sql; do
            psql -h 127.0.0.1 -U postgres -d multisite_test -v ON_ERROR_STOP=1 -f "$file"
          done

  production-access-smoke:
    # Read-only production access check after full CI, with no credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.code_changed == 'true'
    needs: [verify, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify live public health and anonymous API access boundaries
        run: node scripts/production-readonly-smoke.mjs
