name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:seo
      - run: npm run test:sales
      - run: npm run test:sales:api
      - run: npm run test:billing
      - run: npm run test:design
      - run: npm run test:permissions
      - run: npm run test:operating-system
      - run: npm run test:fulfilment
      - run: npm run e2e
      - run: npm audit --audit-level=high
